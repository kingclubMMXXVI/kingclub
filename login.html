<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Member Login — King Club</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container">
            <nav>
                <a class="brand" href="index.html">KING <span>CLUB</span></a>
                <div class="navlinks"><a href="index.html">Public Site</a></div>
            </nav>
        </div>
    </header>
    <main class="login-wrap">
        <div class="login-box">
            <div class="crest"></div>
            <div class="kicker">Members only</div>
            <h2>Member Login</h2>
            <p>Enter your credentials to access the private King Club calendar.</p>
            <form id="loginForm">
                <div class="field">
                    <label for="username">Member ID</label>
                    <input id="username" autocomplete="username" required placeholder="Enter member ID">
                </div>
                <div class="field">
                    <label for="password">Password</label>
                    <input id="password" type="password" autocomplete="current-password" required placeholder="Enter password">
                </div>
                <button class="cta" type="submit">Enter the Club</button>
                <p class="error" id="error">Invalid member ID or password.</p>
            </form>
            <a class="back" href="index.html">← Return to public site</a>
        </div>
    </main>

    <script>
        // Default seed credentials
        const DEFAULT_MEMBERS = [
            { id: "KING001", pass: "MMXXVI", role: "admin", created: "2026-09-01" }
        ];

        // Initialize local database if it doesn't exist
        if (!localStorage.getItem("kingClubUsers")) {
            localStorage.setItem("kingClubUsers", JSON.stringify(DEFAULT_MEMBERS));
        }

        document.getElementById("loginForm").addEventListener("submit", (e) => {
            e.preventDefault();
            const inputId = document.getElementById("username").value.trim().toUpperCase();
            const inputPass = document.getElementById("password").value;
            const errorEl = document.getElementById("error");

            const users = JSON.parse(localStorage.getItem("kingClubUsers") || "[]");
            const match = users.find(user => user.id.toUpperCase() === inputId && user.pass === inputPass);

            if (match) {
                // Save active session
                sessionStorage.setItem("kingClubSession", JSON.stringify(match));
                location.href = "members.html";
            } else {
                errorEl.style.display = "block";
            }
        });
    </script>
</body>
</html>
